# BugBench cases for tinydb, from `prism bench generate` (seed 11, window 500).
# Injected cases: one mutation on a line the commit added; the repo's tests pass at the
# commit and `failing` fails with the mutation. Clean cases: the commit as it is.

[repo]
name = "tinydb"
url = "https://github.com/msiemens/tinydb.git"
license = "MIT"

[[case]]
id = "tinydb-i16"
group = "injected"
commit = "7d4d149"
path = "tinydb/queries.py"
kind = "wrong return value"
