# BugBench cases for sqlite-utils, from `prism bench generate` (seed 7, window 150).
# Injected cases: one mutation on a line the commit added; the repo's tests pass at the
# commit and `failing` fails with the mutation. Clean cases: the commit as it is.

[repo]
name = "sqlite-utils"
url = "https://github.com/simonw/sqlite-utils.git"
license = "Apache-2.0"

[[case]]
id = "sqlite-utils-i01"
group = "injected"
commit = "fd5b09f"
path = "sqlite_utils/cli.py"
kind = "wrong null check"
operator = "is-not-none"
find = """            if tracker is not None:
"""
replace = """            if tracker is None:
"""
failing = "tests/test_cli_memory.py::test_memory_csv[True-test]"

