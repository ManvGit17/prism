# BugBench cases for tinydb, from `prism bench generate` (seed 7, window 150).
# Injected cases: one mutation on a line the commit added; the repo's tests pass at the
# commit and `failing` fails with the mutation. Clean cases: the commit as it is.

[repo]
name = "tinydb"
url = "https://github.com/msiemens/tinydb.git"
license = "MIT"

[[case]]
id = "tinydb-i01"
group = "injected"
commit = "6d7c4fc"
path = "tinydb/queries.py"
kind = "swapped arguments"
operator = "swap-args"
find = """    return isinstance(obj, Sequence) and not isinstance(obj, (str, bytes,
"""
replace = """    return isinstance(Sequence, obj) and not isinstance(obj, (str, bytes,
"""
failing = "tests/test_queries.py::test_any"

