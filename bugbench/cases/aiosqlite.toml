# BugBench cases for aiosqlite, from `prism bench generate` (seed 7, window 150).
# Injected cases: one mutation on a line the commit added; the repo's tests pass at the
# commit and `failing` fails with the mutation. Clean cases: the commit as it is.
# aiosqlite-i07 was removed by hand: its mutation read `while not True:`, which looks planted.
# The operator now skips that shape (tests/test_bench.py).

[repo]
name = "aiosqlite"
url = "https://github.com/omnilib/aiosqlite.git"
license = "MIT"

[[case]]
id = "aiosqlite-i01"
group = "injected"
commit = "b28bed9"
path = "aiosqlite/core.py"
kind = "missing await"
operator = "drop-await"
find = """        await self._execute(self._conn.set_progress_handler, handler, n)
"""
replace = """        self._execute(self._conn.set_progress_handler, handler, n)
"""
failing = "test_set_progress_handler (aiosqlite.tests.smoke.SmokeTest.test_set_progress_handler)"

