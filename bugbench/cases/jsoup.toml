# BugBench cases for jsoup, from `prism bench generate` (seed 7, window 120).
# Injected cases: one mutation on a line the commit added; the repo's tests pass at the
# commit and `failing` fails with the mutation. Clean cases: the commit as it is.
# jsoup-i06 was removed by hand: its mutation read `if (!(i == -1))`, which looks planted.
# The operator now skips that shape (tests/test_bench.py).

[repo]
name = "jsoup"
url = "https://github.com/jhy/jsoup.git"
license = "MIT"

[[case]]
id = "jsoup-i01"
group = "injected"
commit = "cf6ffe08"
path = "src/main/java/org/jsoup/nodes/Element.java"
kind = "wrong boolean operator"
operator = "oror-to-andand"
find = """                || !element.tag.isInline()
"""
replace = """                && !element.tag.isInline()
"""
failing = "ElementTest.textBoundaryTagsDoNotSynthesizeAttributeText"

