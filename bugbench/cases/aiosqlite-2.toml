# BugBench cases for aiosqlite, from `prism bench generate` (seed 11, window 500).
# Injected cases: one mutation on a line the commit added; the repo's tests pass at the
# commit and `failing` fails with the mutation. Clean cases: the commit as it is.

[repo]
name = "aiosqlite"
url = "https://github.com/omnilib/aiosqlite.git"
license = "MIT"

[[case]]
id = "aiosqlite-i12"
group = "injected"
commit = "57bcc6a"
path = "aiosqlite/core.py"
kind = "swapped arguments"
operator = "swap-args"
find = """                get_loop(future).call_soon_threadsafe(future.set_result, result)
"""
replace = """                get_loop(future).call_soon_threadsafe(result, future.set_result)
"""
failing = "timeout"

