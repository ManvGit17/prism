# The BugBench configurations measured on the full benchmark. `make eval-bugbench` runs them
# (from cached answers where they exist), judges every posted comment, sweeps the threshold
# where `sweep = true`, and writes the report. Any other setting (`prism bench run` options, the
# `PRISM_*` settings) can be added as one more [[run]] with its own run folder, and PR-Agent
# as a run with kind = "pr-agent" (see ADR 0022).

cases = ["bugbench/cases/*.toml"]
exclude = ["bugbench/cases/tinydb-slice.toml"]
report = "eval/reports/bugbench.md"
thresholds = [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9]

[settings]  # for every run
gate = "onnx"

[[run]]
name = "PRism"
run = "bb-prism"
seed = ["mid-01"]
sweep = true

[[run]]
name = "Whole PR to Claude"
run = "bb-whole-pr"
settings = { route_all = true, review_unit = "pr" }
seed = ["whole-pr-01"]
sweep = true
worktrees = "worktrees-whole-pr"
judge = false
