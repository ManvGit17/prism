# Every BugBench configuration. `make eval-bugbench` runs them all (from cached answers where
# they exist), judges every posted comment, sweeps the threshold where `sweep = true`, and
# writes the report. Each configuration changes one thing from the first.

cases = ["bugbench/cases/*.toml"]
exclude = ["bugbench/cases/tinydb-slice.toml"]
report = "eval/reports/bugbench.md"
thresholds = [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9]

[settings]  # for every run
gate = "onnx"

[[run]]
name = "PRism"
run = "bb-prism"
seed = ["mid-01"]
sweep = true

[[run]]
name = "PR-Agent"
run = "bb-pr-agent"
kind = "pr-agent"
seed = ["pra-01"]

[[run]]
name = "Whole PR to Claude"
run = "bb-whole-pr"
settings = { route_all = true, review_unit = "pr" }
seed = ["whole-pr-01"]
sweep = true

[[run]]
name = "Claude reviews every hunk"
run = "bb-claude-only"
settings = { route_all = true }
seed = ["claude-only-01"]

[[run]]
name = "Gate off"
run = "bb-gate-off"
settings = { gate = "pass-all" }
seed = ["gate-off-01", "bb-prism"]

[[run]]
name = "Verifier off"
run = "bb-verifier-off"
verifier = "rules"
seed_replies = ["bb-prism"]

[[run]]
name = "Base model"
run = "bb-base-model"
model = "qwen2.5-coder:3b"

[[run]]
name = "Reviewer sees context"
run = "bb-reviewer-context"
settings = { reviewer_context = true }

[[run]]
name = "No context"
run = "bb-ctx-none"
mode = "none"
seed_replies = ["bb-prism"]

[[run]]
name = "Vector context"
run = "bb-ctx-vector"
mode = "vector"
seed_replies = ["bb-prism"]

[[run]]
name = "Graph + vector context"
run = "bb-ctx-graph-vector"
mode = "graph+vector"
seed_replies = ["bb-prism"]
