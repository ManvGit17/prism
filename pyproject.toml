[project]
name = "prism"
version = "0.1.0"
description = "Repo-aware AI code reviewer: GraphRAG over a code graph, a fine-tuned local reviewer model and a verifier."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastembed>=0.9.1",
    "httpx>=0.27",
    "huggingface-hub>=1.33.0",
    "neo4j>=5.20",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "tokenizers>=0.23.3",
    "tree-sitter>=0.26.1",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-python>=0.25.0",
    "typer>=0.29.1",
]

[project.scripts]
prism = "prism.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.6",
]
# Gate classifier training (Phase 3). Not installed by `uv sync` or CI: use
# `uv sync --group training`. Serving the gate needs only onnxruntime and tokenizers.
training = [
    "accelerate>=1.0",
    "onnx>=1.16",
    "peft>=0.13",
    "scikit-learn>=1.5",
    "torch>=2.5",
    "transformers>=4.46",
]

# torch comes from the CPU wheel index: this machine has no NVIDIA GPU, and the CUDA wheels are
# several GB. Kaggle uses its own preinstalled torch (training/requirements-kaggle.txt).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prism"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Sample source code the indexer tests parse; it is data, not project code.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["prism", "tests", "training"]
exclude = ["^tests/fixtures/"]

# The training packages are not installed in CI. Targeted: only these third-party modules.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "onnx", "onnx.*", "sklearn", "sklearn.*", "wandb", "onnxruntime", "onnxruntime.*", "peft", "peft.*", "unsloth", "unsloth.*"]
ignore_missing_imports = true

# Without torch installed, torch.nn.Module is Any, and the export wrapper subclasses it.
[[tool.mypy.overrides]]
module = ["training.gate.export_onnx"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "smoke: needs the Compose services and the host Ollama to be running",
    "download: downloads a model on first run (about 90 MB); CI skips it",
    "training: needs the training dependency group (torch); CI and `make unit` skip it",
]
