[project]
name = "prism"
version = "0.1.0"
description = "Repo-aware AI code reviewer: GraphRAG over a code graph, a fine-tuned local reviewer model and a verifier."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "neo4j>=5.20",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "tree-sitter>=0.26.1",
    "tree-sitter-python>=0.25.0",
    "typer>=0.29.1",
]

[project.scripts]
prism = "prism.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prism"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Sample source code the indexer tests parse; it is data, not project code.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["prism", "tests"]
exclude = ["^tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: needs the Compose services and the host Ollama to be running",
]
